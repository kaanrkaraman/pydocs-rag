[project]
name = "pydocs-rag"
version = "0.1.0"
description = "Python documentation RAG with citations, refusal handling, and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "pyyaml>=6.0.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.14",
    "lxml>=6.0",
    "sentence-transformers>=5.2",
    "faiss-cpu>=1.13",
    "torch>=2.9",
    "numpy>=2.2",
    "scipy>=1.17",
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "openai>=2.15",
    "tiktoken>=0.12",
    "structlog>=25.5",
    "rich>=14.0",
    "typer>=0.16",
    "datasketch>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
    "httpx[http2]",
]

[project.scripts]
pydocs = "pydocs_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydocs_rag"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.14",
    "ty>=0.0.12",
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pydocs_rag", "tests"]
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
    "PTH",
    "ERA",
    "PL",
    "PERF",
]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    "E501",
    "B008",
    "B006",
    "B905",
    "PLC0415",
    "PTH123",
    "PERF401",
    "PLW2901",
    "RUF005",
    "RUF059",
    "SIM102",
    "SIM105",
    "SIM108",
    "C401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PLR2004", "S101"]
"pydocs_rag/cli.py" = ["RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["pydocs_rag"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-missing-attribute = "warn"
invalid-argument-type = "warn"
missing-argument = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
