corpus:
  sources:
    - url: "https://docs.python.org/3/"
      name: "python_docs"
      include_patterns:
        [
          "/3/",
          "!/3.0/",
          "!/3.1/",
          "!/3.2/",
          "!/3.3/",
          "!/3.4/",
          "!/3.5/",
          "!/3.6/",
          "!/3.7/",
        ]
    - url: "https://peps.python.org/"
      name: "peps"
      include_patterns: []
    - url: "https://packaging.python.org/en/latest/"
      name: "packaging"
      include_patterns: []
  crawl_delay_seconds: 0.3
  max_pages_per_source: 3000
  respect_robots_txt: true
  user_agent: "PyDocsRAG/0.1 (educational project)"

parsing:
  remove_nav: true
  remove_footer: true
  remove_sidebar: true
  preserve_code_blocks: true
  preserve_tables: true
  min_paragraph_length: 20

deduplication:
  enabled: true
  similarity_threshold: 0.85
  minhash_num_perm: 128

chunking:
  type: "structure_aware"
  fixed_size:
    chunk_size: 512
    overlap: 64
    split_by: "tokens"
  structure_aware:
    max_chunk_size: 1024
    min_chunk_size: 128
    preserve_code_blocks: true
    heading_weight: 1.5

embedding:
  model_name: "BAAI/bge-base-en-v1.5"
  normalize: true
  batch_size: 32
  max_seq_length: 512
  show_progress: true

faiss:
  index_type: "Flat"
  metric: "inner_product"
  flat: {}
  ivf:
    nlist: 64
    nprobe: 8
  hnsw:
    M: 32
    ef_construction: 200
    ef_search: 128

retrieval:
  top_k: 20
  score_threshold: 0.0

query:
  rewrite_enabled: false
  rewrite_strategy: "expansion"
  max_rewrites: 3

reranker:
  enabled: true
  model_name: "BAAI/bge-reranker-base"
  top_k: 5
  batch_size: 16

context:
  max_tokens: 4000
  max_chunks: 10
  include_metadata: true
  dedup_chunks: true

# "ollama" (local) or "openai" (cloud)
llm:
  provider: "ollama"
  openai_model: "gpt-5.2-mini"
  ollama_model: "llama3.2:3b" # mistral:7b, qwen3:8b, gemma2:9b, etc.
  ollama_base_url: "http://localhost:11434"
  temperature: 0.1
  max_tokens: 4096

generation:
  prompt_version: "v1"
  require_citations: true
  min_citations_per_paragraph: 1

refusal:
  enabled: true
  min_top_score: 0.4
  min_score_margin: 0.1
  min_citations: 0
  ambiguity_detection: true
  fallback_strategy: "extractive"

failure_modes:
  retrieval_miss:
    expand_k_multiplier: 2
    try_rewrite_if_off: true
    max_retries: 2
  hallucination:
    require_citations: true
    trigger_refusal: true
  stale_docs:
    show_crawl_timestamp: true
    prefer_newer: true
    max_age_days: 90
  ambiguous_query:
    ask_clarification: true
    max_clarification_options: 3
  context_overflow:
    strategy: "relevance_ranked"
    preserve_diversity: true

evaluation:
  metrics:
    - "hit_at_k"
    - "mrr"
    - "ndcg"
  k_values: [1, 3, 5, 10]
  answer_rubric:
    correctness_weight: 0.4
    groundedness_weight: 0.4
    completeness_weight: 0.2

logging:
  level: "INFO"
  format: "json"
  output_dir: "logs"
  include_traces: true
  log_retrieval_results: true
  log_token_usage: true

paths:
  data_dir: "data"
  raw_dir: "data/corpus/raw"
  parsed_dir: "data/corpus/parsed"
  chunks_dir: "data/pipeline/chunks"
  embeddings_dir: "data/pipeline/embeddings"
  indices_dir: "data/pipeline/indices"
  cache_dir: "data/cache"
  evaluation_dir: "evaluation"
  logs_dir: "logs"
